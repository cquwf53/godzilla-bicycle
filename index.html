<style>
  *{box-sizing:border-box}body{margin:0;background:#eee9dc;color:#243d36;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:36px 20px}.poster{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:end;padding:0 4px 24px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase}h1{font-size:clamp(29px,5vw,56px);letter-spacing:-2px;margin:12px 0 0;font-weight:800}header p{font-size:13px;line-height:1.8;margin:0;text-align:right;color:#66736a}.scene{border:1px solid #bdc3ae;border-radius:18px;overflow:hidden;background:#e5edd2;box-shadow:0 20px 60px #263e3610}svg{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 4px;font-size:12px;color:#66736a}.status{display:flex;align-items:center;gap:9px}.dot{width:7px;height:7px;border-radius:50%;background:#5a8762}button{border:1px solid #b8c1b1;background:transparent;color:#243d36;padding:10px 17px;border-radius:30px;font:inherit;cursor:pointer}button:hover{background:#dde4d1}button:focus-visible{outline:3px solid #759674;outline-offset:3px}.spin{animation:spin 1.5s linear infinite;transform-box:fill-box;transform-origin:center}.rider{animation:bob 1.5s ease-in-out infinite}.tail{animation:sway 3s ease-in-out infinite;transform-origin:553px 349px}.city{animation:travel 24s linear infinite}.near{animation:travel 7s linear infinite}.clouds{animation:travel 65s linear infinite}.leg-near{animation:legNear 1.5s ease-in-out infinite;transform-origin:541px 320px}.leg-far{animation:legFar 1.5s ease-in-out infinite;transform-origin:536px 320px}.steam{animation:puff 3s ease-out infinite;transform-origin:640px 193px}.paused *{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes travel{to{transform:translateX(-1100px)}}@keyframes legNear{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(13deg)}}@keyframes legFar{0%,100%{transform:rotate(13deg)}50%{transform:rotate(-9deg)}}@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.65)}25%{opacity:.65}100%{opacity:0;transform:translate(40px,-25px) scale(1.3)}}@media(max-width:600px){body{padding:25px 12px}header p{display:none}header{padding-bottom:20px}footer{font-size:10px}.eyebrow{font-size:9px;letter-spacing:2px}}@media(prefers-reduced-motion:reduce){svg *{animation-play-state:paused!important}}
</style>

<script>
  const scene=document.getElementById('animation');
  const toggle=document.getElementById('toggle');
  const caption=document.getElementById('caption');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function update(){const paused=scene.classList.contains('paused');toggle.textContent=paused?'继续骑行':'暂停动画';toggle.setAttribute('aria-pressed',String(paused));caption.textContent=paused?'城市安然无恙 · 休息一下':'城市安然无恙 · 骑行进行中';}
  toggle.addEventListener('click',()=>{scene.classList.toggle('paused');update();});
  if(reduced.matches){scene.classList.add('paused');toggle.disabled=true;toggle.textContent='已减少动态效果';caption.textContent='城市安然无恙 · 静静享受好天气';}
</script>
